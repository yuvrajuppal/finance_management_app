<script>
  // Password Visibility Toggle
  const pwdInput = document.getElementById('password');
  const toggleBtn = document.getElementById('toggle-password');
  const toggleIcon = document.getElementById('toggle-icon');

  if (toggleBtn && pwdInput) {
    toggleBtn.addEventListener('click', () => {
      const isPwd = pwdInput.getAttribute('type') === 'password';
      pwdInput.setAttribute('type', isPwd ? 'text' : 'password');
      toggleIcon.textContent = isPwd ? 'visibility_off' : 'visibility';
    });
  }

  // Real-time password requirement analysis
  const pillLen = document.getElementById('pill-len');
  const pillNum = document.getElementById('pill-num');
  const pillSym = document.getElementById('pill-sym');
  const pillCase = document.getElementById('pill-case');
  const strengthLabel = document.getElementById('strength-label');

  function updatePill(el, valid) {
    const icon = el.querySelector('.material-symbols-outlined');
    if (valid) {
      el.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full font-label-sm text-label-sm bg-tertiary text-on-tertiary transition-colors';
      if (icon) icon.textContent = 'check_circle';
    } else {
      el.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full font-label-sm text-label-sm bg-surface-container text-on-surface-variant transition-colors';
      if (icon) icon.textContent = 'radio_button_unchecked';
    }
  }

  if (pwdInput) {
    pwdInput.addEventListener('input', (e) => {
      const val = e.target.value;
      const hasLen = val.length >= 8;
      const hasNum = /\d/.test(val);
      const hasSym = /[!@#$%^&*(),.?":{}|<>]/.test(val);
      const hasCase = /[a-z]/.test(val) && /[A-Z]/.test(val);

      updatePill(pillLen, hasLen);
      updatePill(pillNum, hasNum);
      updatePill(pillSym, hasSym);
      updatePill(pillCase, hasCase);

      const score = [hasLen, hasNum, hasSym, hasCase].filter(Boolean).length;
      if (val.length === 0) {
        strengthLabel.textContent = 'Enter password';
        strengthLabel.className = 'font-label-sm text-label-sm text-on-surface-variant';
      } else if (score <= 1) {
        strengthLabel.textContent = 'Weak';
        strengthLabel.className = 'font-label-sm text-label-sm text-error font-semibold';
      } else if (score <= 3) {
        strengthLabel.textContent = 'Good';
        strengthLabel.className = 'font-label-sm text-label-sm text-secondary font-semibold';
      } else {
        strengthLabel.textContent = 'Strong';
        strengthLabel.className = 'font-label-sm text-label-sm text-tertiary font-semibold';
      }
    });
  }
</script></main><footer class="w-full py-space-lg text-center font-label-md text-label-md text-on-surface-variant"><p class="">© 2025 Finova Capital Management LLC. All rights reserved.</p></footer>
