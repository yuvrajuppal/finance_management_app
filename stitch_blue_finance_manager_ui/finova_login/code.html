            class="space-y-space-md"
            id="loginForm"
            onsubmit="event.preventDefault()"

            <div class="space-y-space-xs">
              <label
                class="block font-label-md text-label-md text-on-surface"
                for="emailInput"
                >Email</label

              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none"
                  >mail</span
                ><input
                  class="w-full h-11 pl-10 pr-space-md rounded-lg border border-surface-container bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-low transition-all duration-150"
                  id="emailInput"
                  placeholder="name@example.com"
                  required=""
                  type="email"
                />
              </div>
            </div>
            <div class="space-y-space-xs">
              <label
                class="block font-label-md text-label-md text-on-surface"
                for="passwordInput"
                >Password</label
              >
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none"
                  >lock</span
                ><input
                  class="w-full h-11 pl-10 pr-11 rounded-lg border border-surface-container bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-low transition-all duration-150"
                  id="passwordInput"
                  placeholder="••••••••••••"
                  required=""
                  type="password"
                />
              </div>
            </div>
            <div class="flex items-center justify-between pt-space-xs">
              <label
                class="inline-flex items-center gap-space-sm cursor-pointer select-none"
                ><input
                  checked=""
                  class="w-4 h-4 rounded text-primary-container accent-primary-container cursor-pointer"
                  id="rememberDevice"
                  type="checkbox"
                /><span
                  class="font-body-sm text-body-sm text-on-surface-variant"
                  >Remember me</span
                ></label
              ><a
                class="font-label-sm text-label-sm text-secondary hover:underline"
                href="#forgot"
                >Forgot password?</a
              >
            </div>
            <button
              class="w-full h-11 rounded-lg bg-primary-container text-on-primary font-title-md text-title-md shadow-md hover:bg-secondary transition-all duration-150 active:scale-[0.99] flex items-center justify-center"

              type="submit"
            >
              Log In
            </button>

            class="mt-space-lg pt-space-md border-t border-surface-container text-center"
          >

                href="#signup"
